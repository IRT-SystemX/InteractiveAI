<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Dashboard · PowerGrid Simulator</title>
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="https://mpld3.github.io/js/mpld3.v0.5.2.js"></script>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <style>
        :root {
            --header-h: 56px;
            --bg: #f1f5f9;
            --surface: #ffffff;
            --surface-muted: #f8fafc;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-soft: #dbeafe;
            --success: #16a34a;
            --success-hover: #15803d;
            --warning: #d97706;
            --warning-hover: #b45309;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --radius: 12px;
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
            --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.08);
        }

        * { box-sizing: border-box; }

        #message-container {
            display: none;
            width: 100%;
            background: linear-gradient(90deg, #06b6d4, #2563eb);
            color: #fff;
            font-weight: 600;
            text-align: center;
            padding: 12px 0;
            box-shadow: 0 2px 10px rgba(37, 99, 235, 0.35);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            font-size: 18px;
            letter-spacing: 0.01em;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            box-sizing: border-box;
        }
        body {
            display: flex;
            padding-top: var(--header-h);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
            background: var(--bg);
        }

        #header {
            width: 100%;
            height: var(--header-h);
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 24px;
            background: linear-gradient(120deg, #0f172a 0%, #1e293b 100%);
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.25);
            z-index: 900;
        }
        #header .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            font-size: 18px;
        }
        #header h2 {
            margin: 0;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        #header .header-sub {
            color: rgba(226, 232, 240, 0.6);
            font-size: 13px;
            font-weight: 400;
        }
        .center-text { text-align: center; }

        #sidebar {
            width: 440px;
            flex-shrink: 0;
            background: var(--bg);
            padding: 20px;
            height: calc(100vh - var(--header-h));
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow-y: auto;
            font-size: 15px;
        }
        #sidebar h3 {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin: 4px 0 14px;
        }
        .panel-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            margin: 0 0 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #user-info {
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            padding: 18px;
            margin-bottom: 16px;
            background: var(--surface);
            border-radius: var(--radius);
            box-sizing: border-box;
            overflow: hidden;
        }
        #user-info span {
            display: inline;
            white-space: nowrap;
            font-weight: 600;
        }
        #user-info > span#username,
        #user-info > span#server {
            color: var(--primary);
        }
        #user-info span:hover {
            overflow: visible;
            position: relative;
            z-index: 10;
            width: auto;
            white-space: normal;
        }
        #user-info form {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        #user-info label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-top: 8px;
            margin-bottom: 2px;
        }
        #user-info input {
            padding: 9px 12px;
            font-size: 14px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--surface);
            color: var(--text);
            font-family: inherit;
            margin-bottom: 4px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        #user-info input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }
        #user-info button {
            width: auto;
            align-self: flex-start;
            margin-top: 12px;
            padding: 9px 18px;
            font-weight: 600;
            font-size: 14px;
            border: none;
            border-radius: 9px;
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            transition: background-color 0.15s;
        }
        #user-info button:hover { background: var(--primary-hover); }

        #logout-button {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-top: 4px;
            font-weight: 600;
            font-size: 14px;
            padding: 10px 20px;
            background: var(--danger);
            color: #fff;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            transition: background-color 0.15s;
        }
        #logout-button:hover { background: var(--danger-hover); }

        #user-info .info-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 6px 0;
            font-size: 14px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }
        #user-info .info-row:last-of-type { border-bottom: none; margin-bottom: 8px; }

        #main-content {
            display: flex;
            flex-direction: column;
            height: calc(100vh - var(--header-h));
            flex: 1;
            min-width: 0;
            padding: 20px 20px 20px 0;
            gap: 16px;
            overflow: hidden;
        }

        #graph-container {
            flex: 1;
            min-height: 400px;
            overflow: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 8px;
        }
        #graph-title {
            color: var(--text-muted);
            font-size: 16px;
            font-weight: 500;
            margin: auto;
        }
        #graph-content {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #graph-content svg,
        #graph-content canvas {
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            max-height: none !important;
        }
        svg { width: 100% !important; height: 100% !important; }

        #sub-div-container {
            display: flex;
            gap: 16px;
            height: 35vh;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .sub-div {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 18px;
            box-sizing: border-box;
            overflow: auto;
        }

        #events-div {
            width: 300px;
            flex: none;
            overflow-y: auto;
        }
        #events-div::before {
            content: "Events";
            display: block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .status-div {
            margin-bottom: 24px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            color: var(--text);
            padding: 10px 14px;
            background: var(--surface-muted);
            border: 1px solid var(--border);
            border-radius: 999px;
        }
        .sub-div:nth-child(2) {
            align-items: center;
            justify-content: center;
        }

        .status-button {
            margin-bottom: 14px;
            width: 220px;
            max-width: 100%;
            font-weight: 600;
            font-size: 15px;
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: background-color 0.15s, opacity 0.15s;
        }
        .btn-grey { background: var(--surface); color: var(--text); }

        #startButton {
            background: var(--success);
            color: #fff;
            border-color: transparent;
        }
        #startButton:hover:not(:disabled) { background: var(--success-hover); }

        #pauseResumeButton {
            background: var(--warning);
            color: #fff;
            border-color: transparent;
        }
        #pauseResumeButton:hover:not(:disabled) { background: var(--warning-hover); }

        #stopResetButton {
            background: var(--surface);
            color: var(--danger);
            border-color: var(--danger);
        }
        #stopResetButton:hover:not(:disabled) { background: #fef2f2; }

        .status-button:disabled { opacity: 0.5; cursor: not-allowed; }

        #actions-div { overflow-y: auto; }
        #actions-div::before {
            content: "AI recommendations";
            display: block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .action-card {
            background: var(--primary-soft);
            border: 1px solid #bfdbfe;
            border-left: 4px solid var(--primary);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .action-card h4 {
            margin-top: 0;
            margin-bottom: 6px;
            font-size: 15px;
            font-weight: 700;
            color: #1e3a8a;
        }
        .action-card p { margin: 0; font-size: 14px; color: var(--text); }

        .event-card {
            margin: 0 0 12px;
            padding: 14px;
            background: var(--surface-muted);
            border: 1px solid var(--border);
            border-left: 4px solid #06b6d4;
            box-shadow: var(--shadow-sm);
            border-radius: 10px;
        }
        .event-card h4 {
            margin-top: 0;
            margin-bottom: 6px;
            font-size: 15px;
            font-weight: 700;
            color: #0e7490;
        }
        .event-card p { margin: 0; font-size: 14px; color: var(--text); }
    </style>
</head>
<body>
    <div id="header">
        <span class="brand-icon">⚡</span>
        <h2>PowerGrid Simulator <span class="header-sub">· based on the Grid2Op platform</span></h2>
    </div>
    <div id="sidebar">
        <div>
            <h3>Simulator configuration</h3>
            <div id="user-info">
                <div class="info-row">User <span id="username">{{ username }}</span></div>
                <div class="info-row">Connected server <span id="server">{{ server }}</span></div>
                <button id="logout-button" onclick="logout()">Logout</button>
            </div>
            <div id="user-info">
                <div class="panel-title">🧩 Scenario</div>
                <form action="{{ url_for('edit_config') }}" method="post">
                    <label>Grid2Op environment's seed</label>
                    <input type="text" name="env_seed" value="{{ config['env_seed'] }}">
                    <label>Scenario name</label>
                    <input type="text" name="scenario_name" value="{{ config['scenario_name'] }}">
                    <label>Assistant seed</label>
                    <input type="text" name="assistant_seed" value="{{ config['assistant_seed'] }}">
                    <button type="submit">Update</button>
                </form>
            </div>
            <div id="user-info">
                <div class="panel-title">⚙️ Simulation settings</div>
                <form action="{{ url_for('edit_simulation_settings') }}" method="post">
                    <label for="scenario_first_step">Scenario first step [step]</label>
                    <input type="number" id="scenario_first_step" name="scenario_first_step" value="{{ config['scenario_first_step'] }}" required>
                    <label for="stepDuration_s">Time step duration [second]</label>
                    <input type="number" id="stepDuration_s" name="stepDuration_s" value="{{ config['stepDuration_s'] }}" required>
                    <label for="tempo">Context sending frequency to InteractiveAI [step]</label>
                    <input type="number" id="tempo" name="tempo" value="{{ com.outputs_config['Outputs']['Context']['tempo'] }}" required>
                    <label for="refresh_frequency_step">Anticipation risk analysis refresh frequency [step]</label>
                    <input type="number" id="refresh_frequency_step" name="refresh_frequency_step" value="{{ config['refresh_frequency_step'] }}" required>
                    <label for="time_step_forecast">Anticipation risk analysis range [step]</label>
                    <input type="number" id="time_step_forecast" name="time_step_forecast" value="{{ config['time_step_forecast'] }}" required>
                    <label for="duration_step_forecast">Risk analysis duration [step]</label>
                    <input type="number" id="duration_step_forecast" name="duration_step_forecast" value="{{ config['duration_step_forecast'] }}" required>
                    <label for="step_start_security_analysis">Security analysis start [step]</label>
                    <input type="number" id="step_start_security_analysis" name="step_start_security_analysis" value="{{ config['step_start_security_analysis'] }}" required>
                    <button type="submit">Update</button>
                </form>
            </div>
        </div>
    </div>
    <div id="main-content">
        <div id="message-container">
            {{message}}
        </div>
        <div id="graph-container" class="sub-div-graph">
            <h2 id="graph-title">Interactive Graph</h2>
            <div id="graph-content"></div>
        </div>
        <div id="sub-div-container">
            <div class="sub-div" id="events-div" >
            </div>
            <div class="sub-div">
                <div id="status-div" class="status-div">Start the simulator</div>
                <button id="startButton" type="submit" class="btn btn-lg btn-grey status-button">Start</button>
                <button id="pauseResumeButton" class="btn btn-lg btn-grey status-button" onclick="togglePause()" disabled>Pause</button>
                <button id="stopResetButton" class="btn btn-lg btn-grey status-button">Stop and reset</button>
            </div >
            <div class="sub-div" id="actions-div">
                <div id="action-container"></div>
            </div>
        </div>
    </div>

    <script>
        function logout() {
            // Logout
            window.location.href = '/';
        }
    </script>


    <script>
        var socket = io();
        socket.on('connect', function() {
            console.log('Connected to Socket.IO server');
        });
        socket.on('update_graph', function(receivedData) {
            console.log("Data received:", receivedData);
            var graphTitle = document.getElementById('graph-title')
            if (receivedData && receivedData.data) {
                var graphContainer = document.getElementById('graph-content');
                graphContainer.innerHTML = receivedData.data;

                // Exécuter les scripts injectés
                var scripts = graphContainer.getElementsByTagName('script');
                for (var i = 0; i < scripts.length; i++) {
                    eval(scripts[i].text);
                }

                // Hide the graph title
                graphTitle.style.display = 'none';

                console.log("Graph updated");
            } else {
                console.error("Invalid graph data");
            }
        });
    </script>

    <script>
        var eventSource = null;
        const startButton = document.getElementById('startButton');

        startButton.addEventListener('click', function() {
            if (!eventSource) {
                eventSource = new EventSource('/start_simulation');

                eventSource.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    console.log(data);
                    if (data.div === 'events-div') {
                        addEventCard(data.content);
                    } else if (data.div === 'message-container') {
                        addMessage(data.content);
                    } else if (data.div === 'actions-div') {
                        postAction(data.content);
                    } else if (data.div === 'simulation-state') {
                        const btn = document.getElementById('pauseResumeButton');
                        if (data.content === 'paused') {
                            isPaused = true;
                            btn.textContent = 'Resume';
                            // The server only sends 'paused' when it needs the
                            // user to act on an InteractiveAI recommendation and
                            // click Resume. Guarantee the button is clickable at
                            // that moment, regardless of any prior disabled state
                            // (page refresh, SSE reconnect, etc.).
                            btn.disabled = false;
                        } else if (data.content === 'running') {
                            isPaused = false;
                            btn.textContent = 'Pause';
                        }
                    } else {
                        const outDiv = document.getElementById(data.div);
                        outDiv.innerHTML = data.content;
                    }
                };

                eventSource.onerror = function(err) {
                    console.error('EventSource failed:', err);
                    eventSource.close();
                    eventSource = null;
                };

                startButton.disabled = true; // Disable the button after starting
                document.getElementById('pauseResumeButton').disabled = false;
            }
        });

        document.getElementById('startButton').addEventListener('click', function() {
            disableSidebar();
        });

        function addEventCard(content) {
            const eventsDiv = document.getElementById('events-div');
            const card = document.createElement('div');
            card.className = 'event-card';
            console.log(content);
            card.innerHTML = `<h4>${content.title}</h4><p>${content.description}</p>`;
            eventsDiv.appendChild(card);
        }

        function addMessage(content) {
            const messageContainer = document.getElementById('message-container');
            console.log(content);
            messageContainer.style.display = 'block'; // Show the div
            messageContainer.innerHTML = content; // Replace existing content with the new message

            // Hide message after 10 seconds
            setTimeout(() => {
                messageContainer.style.display = 'none';
                sessionStorage.removeItem('message');
            }, 10000);
        }

        // Retrieve the session message and display it
        // document.addEventListener('DOMContentLoaded', (event) => {
        //     const message = "{{ session.get('message', '') }}";
        //     if (message) {
        //         addMessage(message);
        //         // Store message in sessionStorage
        //         sessionStorage.setItem('message', message);
        //     }
        // });

        document.addEventListener('DOMContentLoaded', function(event) {
            const messagesData = {{ messages | tojson | safe }};
            if (messagesData.length > 0) {
                messagesData.forEach(message => addMessage(message));
                // Store messages in sessionStorage
                sessionStorage.setItem('messages', JSON.stringify(messagesData));
            }
        });

        // Check for messages in sessionStorage
        // const storedMessage = sessionStorage.getItem('message');
        // if (storedMessage) {
        //     addMessage(storedMessage);
        // }

        const storedMessages = JSON.parse(sessionStorage.getItem('messages') || '[]');
        if (storedMessages.length > 0) {
            storedMessages.forEach(message => addMessage(message));
        }

        function postAction(content) {
            const actionContainer = document.getElementById('action-container');
            console.log(content);

            if (typeof content === 'string') {
                // If content is a string, display it directly
                actionContainer.innerHTML = content;
            } else if (typeof content === 'object' && content.title && content.description) {
                // If content is an object with title and description, create a card
                const card = document.createElement('div');
                card.className = 'action-card';
                card.innerHTML = `<h4>${content.title}</h4><p>${content.description}</p>`;
                actionContainer.innerHTML = ''; // Clear previous content
                actionContainer.appendChild(card);

                // Display duration of 30 seconds
                setTimeout(() => {
                actionContainer.innerHTML = ''; // Clear content after 30 seconds
                }, 30000);
            }
        }

        function disableSidebar() {
            const sidebar = document.getElementById('sidebar');
            const inputs = sidebar.querySelectorAll('input, button, select, textarea, a');
            inputs.forEach(input => {
                input.disabled = true; // Disable form elements
                if (input.tagName === 'A') {
                    input.setAttribute('onclick', 'return false;'); // Disable links
                    input.style.pointerEvents = 'none'; // Prevent link clicks
                }
            });
        }

        let isPaused = false;

        function togglePause() {
            const btn = document.getElementById('pauseResumeButton');
            if (isPaused) {
                fetch('/continue_simulation', { method: 'POST' })
                    .then(response => {
                        if (response.ok) {
                            isPaused = false;
                            btn.textContent = 'Pause';
                            document.getElementById('action-container').innerHTML = '';
                        }
                    })
                    .catch(error => console.error('Error:', error));
            } else {
                fetch('/pause_simulation', { method: 'POST' })
                    .then(response => {
                        if (response.ok) {
                            isPaused = true;
                            btn.textContent = 'Resume';
                        }
                    })
                    .catch(error => console.error('Error:', error));
            }
        }
    </script>

    <script>
        document.getElementById('stopResetButton').addEventListener('click', function() {
            if (eventSource) {
                eventSource.close(); // Close the EventSource
                eventSource = null;
            }

            // Re-enable Start, disable Pause/Resume
            startButton.disabled = false;
            const pauseBtn = document.getElementById('pauseResumeButton');
            pauseBtn.disabled = true;
            pauseBtn.textContent = 'Pause';
            isPaused = false;

            enableSidebar(); // Re-enable sidebar


            startButton.disabled = false; // Re-enable Start button
            enableSidebar(); // Re-enable sidebar

            // AJAX call to reset simulation on server
            fetch('/reset_simulation', {
                method: 'POST'
            }).then(response => response.json())
            .then(data => console.log(data))
            .catch(error => console.error('Error:', error));
        });

        function enableSidebar() {
            const sidebar = document.getElementById('sidebar');
            const inputs = sidebar.querySelectorAll('input, button, select, textarea, a');
            inputs.forEach(input => {
                input.disabled = false; // Re-enable form elements
                if (input.tagName === 'A') {
                    input.removeAttribute('onclick'); // Re-enable links
                    input.style.pointerEvents = 'auto'; // Allow link clicks
                }
            });
        }
    </script>

</body>
</html>
