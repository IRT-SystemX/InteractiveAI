          description: RTE TSO Group
          realtime: false
        - id: Dispatcher
          name: Dispatcher
          description: Dispatcher Group
          realtime: true
        - id: Planner
          name: Planner
          description: Planner Group
          realtime: true
        - id: Supervisor
          name: Supervisor
          description: Supervisor Group
          realtime: true
        - id: Manager
          name: Manager
          description: Manager Group
          realtime: false
        - id: ReadOnly
          name: ReadOnly
          description: ReadOnly Group
          realtime: false
      entities:
      - id: Railway
        name: National society of French railroads
        description: National society of French railroads
        parents : ["IRT_MAIN"]
      - id: ORANGE
        name: Orange
        description: Orange
        parents : ["IRT_MAIN"]
      - id: ATM
        name: ATM usecase
        description: ATM usecase
        parents : ["IRT_MAIN"]
